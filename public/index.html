<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Crazy Arcade</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Dotum", "굴림", sans-serif;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        background: #000;
      }
      #log {
        position: fixed;
        left: 8px;
        bottom: 8px;
        max-width: 46ch;
        max-height: 30vh;
        overflow: auto;
        color: #9be89b;
        font: 11px/1.35 ui-monospace, monospace;
        white-space: pre-wrap;
        pointer-events: none;
        text-shadow: 0 1px 0 #000;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="800" height="600"></canvas>
    <div id="log"></div>
    <script type="module" src="/build/main.js"></script>
  </body>
</html>
