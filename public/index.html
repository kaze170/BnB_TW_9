<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>爆爆王 Crazy Arcade BnB (台灣零售版 v9)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #081832 0%, #020610 100%);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #frame {
        position: relative;
        width: 800px;
        height: 600px;
        box-shadow:
          0 0 0 2px rgba(96, 175, 255, 0.45),
          0 24px 64px rgba(0, 0, 0, 0.85);
        background: #000;
      }
      #screen {
        display: block;
        width: 800px;
        height: 600px;
        image-rendering: pixelated;
        cursor: none;
      }
      #fallback {
        display: none;
        position: absolute;
        inset: 0;
        padding: 36px;
        background: #06142c;
        color: #dff0ff;
        font: 15px/1.6 system-ui, sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="screen" width="800" height="600"></canvas>
      <div id="fallback"></div>
    </div>
    <script type="module" src="/build/main.js?v=57"></script>
  </body>
</html>
